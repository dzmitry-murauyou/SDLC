VaultStore</tspan></text><line x1="1570" y1="232" x2="1570" y2="1095" stroke="#8995a5" stroke-width="1.5" stroke-dasharray="7 6"/><rect x="423" y="270" width="14" height="790" fill="#ffffff" stroke="#315f8e" stroke-width="1.2"/><rect x="708" y="300" width="14" height="740" fill="#ffffff" stroke="#315f8e" stroke-width="1.2"/><rect x="993" y="410" width="14" height="345" fill="#ffffff" stroke="#315f8e" stroke-width="1.2"/><rect x="1278" y="490" width="14" height="190" fill="#ffffff" stroke="#315f8e" stroke-width="1.2"/><rect x="1563" y="790" width="14" height="85" fill="#ffffff" stroke="#315f8e" stroke-width="1.2"/><path d="M 145 285 L 430 285" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="287.5" y="276" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">1. Ввести мастер-пароль и нажать «Открыть»</text><path d="M 430 345 L 715 345" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="572.5" y="336" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">2. unlock(masterPassword)</text><path d="M 715 390 h 55 v 22 h -45" fill="none" stroke="#26364a" stroke-width="1.7" marker-end="url(#arrow)"/><text x="749" y="382" text-anchor="middle" font-size="14" font-weight="400" fill="#182230">3. verifyMaster(password)</text><path d="M 715 465 L 1000 465" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="857.5" y="456" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">4. requestAssertion(challenge)</text><path d="M 1000 520 L 1285 520" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1142.5" y="511" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">5. challenge</text><path d="M 145 575 L 1285 575" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="715.0" y="566" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">6. Подтвердить касанием (если запрошено)</text><path d="M 1285 630 L 1000 630" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#openArrow)" stroke-dasharray="7 5"/><text x="1142.5" y="621" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">7. signedAssertion</text><path d="M 1000 685 L 715 685" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#openArrow)" stroke-dasharray="7 5"/><text x="857.5" y="676" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">8. assertionValid</text><rect x="650" y="735" width="1020" height="340" rx="12" fill="#ffffff" stroke="#68778a" stroke-width="1.6"/><path d="M 650 775 L 1670 775" stroke="#68778a" stroke-width="1.2"/><text x="700" y="763" text-anchor="start" font-size="16" font-weight="700" fill="#40536a">alt</text><text x="810" y="763" text-anchor="start" font-size="15" font-weight="400" fill="#40536a">оба фактора корректны</text><path d="M 715 820 L 1570 820" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1142.5" y="811" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">9. openEncryptedVault()</text><path d="M 1570 860 L 715 860" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#openArrow)" stroke-dasharray="7 5"/><text x="1142.5" y="851" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">10. vaultReady</text><path d="M 715 900 L 430 900" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#openArrow)" stroke-dasharray="7 5"/><text x="572.5" y="891" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">11. state = Unlocked</text><path d="M 430 935 L 145 935" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#openArrow)" stroke-dasharray="7 5"/><text x="287.5" y="926" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">Показать список без раскрытия секретов</text><path d="M 650 965 L 1670 965" stroke="#68778a" stroke-width="1.2"/><text x="810" y="987" text-anchor="start" font-size="15" font-weight="400" fill="#8b3a31">else: неверный фактор / отмена / ошибка</text><path d="M 715 1015 L 430 1015" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#openArrow)" stroke-dasharray="7 5"/><text x="572.5" y="1006" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">genericFailure; state = Locked</text><path d="M 430 1045 L 145 1045" fill="none" stroke="#26364a" stroke-width="1.8" marker-end="url(#openArrow)" stroke-dasharray="7 5"/><text x="287.5" y="1036" text-anchor="middle" font-size="15" font-weight="500" fill="#182230">Показать нейтральную ошибку</text></svg>