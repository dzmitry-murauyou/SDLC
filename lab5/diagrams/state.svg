<text x="750.0" y="78" text-anchor="middle" font-size="17" font-weight="400" fill="#566579">Жизненный цикл доступа к локальному хранилищу</text><path d="M 100 425 L 205 425" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 410 425 L 515 425" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><text x="465" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#40536a">создать Vault</text><path d="M 720 425 L 835 425" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><text x="780" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#40536a">инициализация + ключ</text><path d="M 1040 425 L 1135 425" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><text x="1090" y="360" text-anchor="middle" font-size="15" font-weight="600" fill="#40536a">запрос разблокировки</text><path d="M 1245 475 L 1245 635" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><text x="1350" y="560" text-anchor="middle" font-size="15" font-weight="600" fill="#40536a">оба фактора верны</text><path d="M 1135 450 L 1040 450" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><text x="1090" y="495" text-anchor="middle" font-size="15" font-weight="600" fill="#40536a">ошибка / отмена</text><path d="M 1135 675 L 840 675" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><text x="985" y="720" text-anchor="middle" font-size="15" font-weight="600" fill="#40536a">ручная / Windows-блокировка</text><path d="M 835 650 L 835 475" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="560" text-anchor="middle" font-size="15" font-weight="600" fill="#40536a">завершить блокировку</text><circle cx="70" cy="425" r="16" fill="#26364a"/><rect x="205" y="385" width="205" height="80" rx="20" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.4"/><text x="307.5" y="418.0" text-anchor="middle" font-size="