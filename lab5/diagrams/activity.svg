<rect width="100%" height="100%" fill="#ffffff"/>
<text x="750.0" y="48" text-anchor="middle" class="title">Диаграмма активности: разблокировка и работа с wallet-secret</text>
<text x="750.0" y="78" text-anchor="middle" font-size="17" font-weight="400" fill="#566579">Основной поток с негативной ветвью; секрет раскрывается только по явной команде</text><rect x="0" y="125" width="420" height="1710" fill="#fbfcfe" stroke="#b7c2cf" stroke-width="1.4"/><text x="210.0" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#26364a">Пользователь</text><rect x="420" y="125" width="620" height="1710" fill="#fbfcfe" stroke="#b7c2cf" stroke-width="1.4"/><text x="730.0" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#26364a">Guardian</text><rect x="1040" y="125" width="460" height="1710" fill="#fbfcfe" stroke="#b7c2cf" stroke-width="1.4"/><text x="1270.0" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#26364a">USB-ключ FIDO2</text><circle cx="650.0" cy="165.0" r="14" fill="#26364a"/><rect x="85" y="220" width="250" height="70" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="210.0" y="248.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="210.0" dy="0">Запустить Guardian</tspan></text><rect x="85" y="335" width="250" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="210.0" y="369.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="210.0" dy="0">Ввести мастер-пароль</tspan></text><rect x="585" y="455" width="310" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="740.0" y="489.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="740.0" dy="0">Проверить мастер-пароль</tspan></text><rect x="585" y="575" width="310" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="740.0" y="609.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="740.0" dy="0">Запросить ответ FIDO2</tspan></text><rect x="1105" y="700" width="330" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="1270.0" y="734.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="1270.0" dy="0">Подтвердить запрос</tspan><tspan x="1270.0" dy="19">на USB-ключе</tspan></text><rect x="585" y="825" width="310" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="740.0" y="859.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="740.0" dy="0">Проверить ответ ключа</tspan></text><polygon points="740.0,945 850,1002.5 740.0,1060 630,1002.5" fill="#fff8ed" stroke="#40536a" stroke-width="2.2"/><text x="740.0" y="998.5" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="740.0" dy="0">Оба фактора</tspan><tspan x="740.0" dy="19">корректны?</tspan></text><rect x="585" y="1100" width="310" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="740.0" y="1134.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="740.0" dy="0">Открыть локальное</tspan><tspan x="740.0" dy="19">хранилище</tspan></text><rect x="85" y="1210" width="250" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="210.0" y="1244.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="210.0" dy="0">Выбрать wallet-запись</tspan></text><rect x="85" y="1320" width="250" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="210.0" y="1354.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="210.0" dy="0">Явно запросить</tspan><tspan x="210.0" dy="19">просмотр / копирование</tspan></text><rect x="585" y="1320" width="310" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="740.0" y="1354.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="740.0" dy="0">Временно показать</tspan><tspan x="740.0" dy="19">или скопировать секрет</tspan></text><rect x="85" y="1480" width="250" height="82" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="210.0" y="1514.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="210.0" dy="0">Запросить блокировку</tspan><tspan x="210.0" dy="19">или заблокировать Windows</tspan></text><rect x="585" y="1600" width="310" height="90" rx="14" fill="#f4f8fc" stroke="#315f8e" stroke-width="2.2"/><text x="740.0" y="1638.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="740.0" dy="0">Скрыть секреты; очистить</tspan><tspan x="740.0" dy="19">clipboard, если возможно</tspan></text><circle cx="650.0" cy="1797.5" r="17" fill="#fff" stroke="#26364a" stroke-width="3"/><circle cx="650.0" cy="1797.5" r="11" fill="#26364a"/><rect x="85" y="1080" width="250" height="82" rx="14" fill="#fff3f0" stroke="#315f8e" stroke-width="2.2"/><text x="210.0" y="1114.0" text-anchor="middle" font-size="16" font-weight="400" fill="#182230"><tspan x="210.0" dy="0">Оставить Locked;</tspan><tspan x="210.0" dy="19">нейтральная ошибка</tspan></text><circle cx="380.0" cy="1187.5" r="17" fill="#fff" stroke="#26364a" stroke-width="3"/><circle cx="380.0" cy="1187.5" r="11" fill="#26364a"/><path d="M 650 180 L 210 220" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 210 290 L 210 335" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 335 376 L 585 496" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 740 537 L 740 575" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 895 616 L 1105 741" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1105 741 L 895 866" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 740 907 L 740 945" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 740 1060 L 740 1100" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><text x="785" y="1084" text-anchor="middle" font-size="15" font-weight="600" fill="#40536a">да</text><path d="M 630 1002 L 335 1121" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><text x="460" y="1035" text-anchor="middle" font-size="15" font-weight="600" fill="#40536a">нет</text><path d="M 210 1162 L 380 1170" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 585 1141 L 335 1250" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 210 1292 L 210 1320" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 335 1361 L 585 1361" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 585 1402 L 335 1521" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 335 1521 L 585 1645" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/><path d="M 740 1690 L 650 1780" fill="none" stroke="#26364a" stroke-width="2" marker-end="url(#arrow)"/></svg>